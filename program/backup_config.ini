
[directories]

folders = e:\Учеба (recursive), c:\My\Soft\my_razrab (recursive), c:\My\text (recursive), e:\My2\новая работа (recursive), c:\Users\User\Dropbox (recursive)
	

#files = 
#    C:\Users\Username\*.pdf
#    C:\Users\Username\*.docx
#    D:\Important\finances.xlsx
#    *.jpg  ; все JPG в папке программы

[exclusions]

extensions = .tmp, .log, .cache, .temp, .bak, .swp

[telegram]
# ТОКЕН Telegram бота:
# Получить у @BotFather: https://t.me/botfather
# Формат: bot1234567890:ABCdefGHIjklMNOpqrsTUVwxyz0123456789

api_token = 1234567890:ABCdefGHIjklMNOpqrsTUVwxyz0123456789

# ID ТЕЛЕГРАМ КАНАЛА:
# Публичный канал: @channel_name
# Приватный канал: -1001211167890

channel_id = -1011151932222

# ПАРОЛЬ для архива:
# Если пусто - архив будет без пароля
# Рекомендуется установить пароль!

password = 123

# МАКСИМАЛЬНЫЙ размер файла для Telegram (в МБ):
# Telegram ограничивает 2000 МБ, но рекомендуемое - 49 МБ
# Файлы больше этого размера будут разделены на части

max_file_size_mb = 49

[backup]
# ФАЙЛ для хранения контрольных сумм:
# Здесь хранятся хэши файлов для отслеживания изменений

storage_file = checksums.json

# ВРЕМЕННАЯ папка:
# Здесь создаются архивы перед отправкой

temp_folder = temp_backup

# ТОЛЬКО СКАНИРОВАНИЕ при первом запуске:
# true - только сканировать, не создавать архив
# false - сразу создавать архив

first_run_only_scan = true

# ФАЙЛ ЛОГОВ:
# Логи работы программы (токены автоматически скрываются)

log_file = backup.log

# ПАПКА для хранения архивов локально:
# Если указана - архивы будут сохраняться здесь
# Если пусто - архивы удаляются после отправки

archive_storage_folder =

# ХРАНИТЬ последних N архивов локально:
# 0 - не хранить локально (только отправлять в Telegram)
# >0 - хранить указанное количество последних архивов

keep_last_archives = 0

# ТИП БЭКАПА:
# full - всегда полный бэкап
# incremental - только инкрементальный
# mixed - полный по расписанию, инкрементальный между ними

backup_type = incremental

# ИНТЕРВАЛ полных бэкапов (в днях):
# Только для backup_type = mixed

full_backup_interval_days = 7

; МАКСИМАЛЬНОЕ количество инкрементальных бэкапов:
; Старые будут удаляться при превышении

max_incremental_backups = 30